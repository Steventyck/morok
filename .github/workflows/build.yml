name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Create Android project around index.html
        run: |
          test -f index.html || { echo "index.html not found in repo root"; exit 1; }
          mkdir -p app/src/main/assets app/src/main/java/com/morok/game
          cp index.html app/src/main/assets/index.html
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1c1925" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#2a2538" android:pathData="M0,92h108v16h-108z"/>
              <path android:fillColor="#5a5470" android:pathData="M22,88V50a32,32 0 0 1 64,0V88z"/>
              <path android:fillColor="#7a7490" android:pathData="M22,88V50a32,32 0 0 1 6,-18V88z"/>
              <path android:fillColor="#0b0a10" android:pathData="M31,88V52a23,23 0 0 1 46,0V88z"/>
              <path android:fillColor="#e8c04a" android:pathData="M49,15h10v9h-10z"/>
              <path android:fillColor="#7a4f14" android:pathData="M49,71h10v5h-10z"/>
              <path android:fillColor="#a8731f" android:pathData="M45,76h18v5h-18z"/>
              <path android:fillColor="#c9962f" android:pathData="M41,81h26v4h-26z"/>
              <path android:fillColor="#e8c04a" android:pathData="M37,85h34v4h-34z"/>
              <path android:fillColor="#fff2b0" android:pathData="M37,85h34v1h-34z"/>
              <path android:fillColor="#d0483f" android:pathData="M42,46h6v4h-6z"/>
              <path android:fillColor="#d0483f" android:pathData="M60,46h6v4h-6z"/>
              <path android:fillColor="#ffd0c8" android:pathData="M43,47h2v2h-2z"/>
              <path android:fillColor="#ffd0c8" android:pathData="M61,47h2v2h-2z"/>
              <path android:fillColor="#5a5470" android:pathData="M10,66h10v5h-10z"/>
              <path android:fillColor="#5a5470" android:pathData="M88,66h10v5h-10z"/>
              <path android:fillColor="#ff9a2a" android:pathData="M12,54h6v12h-6z"/>
              <path android:fillColor="#ff9a2a" android:pathData="M90,54h6v12h-6z"/>
              <path android:fillColor="#ffe27a" android:pathData="M13,58h4v8h-4z"/>
              <path android:fillColor="#ffe27a" android:pathData="M91,58h4v8h-4z"/>
          </vector>
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MorokGame"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.morok.game'
              compileSdk 34
              defaultConfig { applicationId 'com.morok.game'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }
              buildTypes { release { minifyEnabled false } }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application android:label="Глубины Морока" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:allowBackup="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/morok/game/MainActivity.java <<'EOF'
          package com.morok.game;

          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF13111A);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl("file:///android_asset/index.html");
                  immersive();
              }

              private void immersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) immersive(); }
              @Override protected void onPause() { super.onPause(); web.onPause(); }
              @Override protected void onResume() { super.onResume(); web.onResume(); }
          }
          EOF
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: morok-apk, path: app/build/outputs/apk/debug/app-debug.apk }
