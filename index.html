<title>Глубины Морока</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen phone game. HUD, square dungeon view, log, then joystick on the left and action buttons on the right. */
:root{
  --bg:#13111a; --panel:#1c1925; --panel2:#262235; --line:#3a3450; --fg:#e9e3d3; --dim:#8d869c;
  --amber:#e2a94b; --blood:#d0483f; --moss:#72b56c; --ice:#5fa0e0; --violet:#a47ad8;
  --display:'Silkscreen','Courier New',monospace; --body:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;height:100dvh}
body{background:var(--bg);color:var(--fg);font:13px/1.35 var(--body);overflow:hidden;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  padding-block:6px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{box-sizing:border-box}
button{font-family:inherit}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;gap:6px;max-width:520px;margin:0 auto}
#hud{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:6px 8px}
#hpwrap{position:relative;height:16px;background:#2a1417;border:1px solid #5a2a2e}
#hpbar{position:absolute;inset:0 auto 0 0;background:var(--blood);width:100%;transition:width .2s}
#hptxt{position:absolute;inset:0;text-align:center;font:700 11px/16px var(--display);text-shadow:0 1px 0 #000}
#bMenu{width:34px;height:26px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);font:700 14px var(--display);padding:0;cursor:pointer}
#xpwrap{grid-column:1/-1;height:4px;background:#26222f}
#xpbar{height:100%;background:var(--ice);width:0}
#statline{grid-column:1/-1;display:flex;justify-content:space-between;gap:4px;font:10px var(--display);color:var(--dim);white-space:nowrap}
#statline b{color:var(--amber)}
#stage{position:relative;flex:1 1 0;min-height:0;border:1px solid var(--line);background:#0b0a10;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#zoomb{position:absolute;left:8px;top:8px;z-index:3;display:flex;flex-direction:column;gap:4px}
#zoomb .btn{width:34px;height:34px;min-height:0;padding:0;font-size:18px;background:rgba(28,25,37,.78)}
#mini{position:absolute;top:8px;right:8px;width:96px;height:96px;z-index:3;background:rgba(10,8,16,.72);border:1px solid var(--line);image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
#fps{position:absolute;left:max(62px,calc(env(safe-area-inset-left,0px) + 54px));top:86px;z-index:7;font:600 11px "IBM Plex Mono",monospace;color:#9fe39a;background:rgba(10,8,16,.6);padding:2px 7px;border-radius:6px;pointer-events:none}
#fps[hidden]{display:none!important}
#mini.big{width:176px;height:176px;background:rgba(10,8,16,.85)}
#mini[hidden]{display:none!important}
#log{height:62px;flex:none;overflow:hidden;background:var(--panel);border:1px solid var(--line);padding:4px 8px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px}
#log div{opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log div:last-child{opacity:1}
#log .bad{color:var(--blood)}#log .good{color:var(--moss)}#log .info{color:var(--ice)}#log .gold{color:var(--amber)}#log .mag{color:var(--violet)}
#controls{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:2px}
#joy{position:relative;width:138px;height:138px;border-radius:50%;flex:none;touch-action:none;
  background:radial-gradient(circle,#2a2538 0,#1a1724 70%);border:2px solid var(--line)}
#joy::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed #3a3450}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#8a7fb0,#4b4468);border:2px solid #b8aee0;box-shadow:0 3px 0 #120f1a}
#dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:3px;flex:none;touch-action:none}
#dpad .btn{min-height:0;padding:0;font-size:18px}
#dpad span{display:block}
#controls.lefty{flex-direction:row-reverse}
.mhead .hb{width:38px;height:34px;min-height:0;padding:0;font-size:18px;flex:none}
.mhead{gap:8px}
#acts{display:grid;grid-template-columns:1.3fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;flex:1;max-width:270px;height:138px}
#acts .btn{min-height:0;font-size:11px;padding:0 2px;line-height:1.15}
#bAtk{grid-row:1/3;grid-column:1;background:#5a2a2e;border-color:var(--blood);color:#fff;font-size:15px!important;letter-spacing:.04em;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
#bAtk:active,#bAtk.hold{background:#8a3a3e;border-color:#ff8a7e}
#bDown.on{border-color:var(--amber);color:var(--amber);animation:dpulse 1s infinite}
@keyframes dpulse{50%{background:#4a3d20}}
.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);font:700 12px var(--display);padding:0 8px;border-radius:0;min-height:42px;cursor:pointer;touch-action:manipulation}
.btn:active,.btn.on{background:#383250;border-color:var(--amber)}
.btn:disabled{opacity:.45}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
#bSkill{font-size:11px;color:#fff;background:#3a2a5e;border-color:var(--violet);position:relative;overflow:hidden}
#bSkill .cd{position:absolute;left:0;bottom:0;height:4px;background:var(--violet)}
.ov{position:absolute;inset:0;background:rgba(10,8,14,.96);display:flex;flex-direction:column;gap:10px;padding:12px;overflow:auto;z-index:5;border:1px solid var(--line);touch-action:pan-y}
.ov.full{position:fixed;inset:0;max-width:520px;margin:0 auto;border:0;background:var(--bg);z-index:20;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.ov[hidden]{display:none!important}
#ovMenu{overflow:hidden;padding-bottom:0;gap:8px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex:none}
#mBody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;padding-bottom:6px}
#mBody>*{flex:none}
#tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;min-width:0;cursor:pointer;font:700 8.5px var(--display);letter-spacing:0}
.tab img{width:24px;height:24px;image-rendering:pixelated}
.tab span{max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tab.on{color:var(--amber);border-color:var(--amber);background:#2a2335}
.tab:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.bar{height:5px;background:#2f2a40;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--violet)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:40;background:var(--amber);color:#1a1208;font:700 12px var(--display);padding:8px 12px;border:2px solid #fff3c8;max-width:92%;text-align:center}
.ov h1{font:700 28px/1.02 var(--display);color:var(--amber);margin:0;letter-spacing:.02em;text-wrap:balance;text-shadow:0 3px 0 #3a260a}
.ov h2{font:700 16px var(--display);color:var(--amber);margin:0}
.ov p{margin:0;color:var(--dim);max-width:46ch}
.ov .row{display:flex;gap:8px;flex-wrap:wrap}
.ov .btn{padding:0 14px}
.ov .big{background:var(--amber);color:#1a1208;border-color:var(--amber);min-height:50px;font-size:14px;flex:1}
.ov .big:active{background:#f0c070}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card{background:var(--panel);border:2px solid var(--line);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;color:var(--fg);font:11px var(--body)}
.card.sel{border-color:var(--amber);background:#2a2335}
.card.lock{opacity:.6}
.card img{width:48px;height:48px;image-rendering:pixelated}
.card b{font:700 11px var(--display)}
.card small{color:var(--dim);font-size:10px;line-height:1.25}
.item{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);padding:6px 8px;background:var(--panel)}
.item img{width:32px;height:32px;image-rendering:pixelated}
.item small{color:var(--dim);display:block}
.item .btn{min-height:36px;padding:0 10px}
.eq{border-color:var(--amber)}
.pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:10px;height:6px;background:#2f2a40;display:block}
.pips i.on{background:var(--amber)}
.souls{font:700 14px var(--display);color:var(--violet)}
.hint{font-size:11px;color:var(--dim)}

.gem{display:inline-flex;align-items:center;gap:4px;color:var(--ice);font:700 13px var(--display)}
.gem img{width:16px;height:16px;image-rendering:pixelated}
#mClose{width:38px;height:32px;min-height:0;padding:0;font-size:20px}
.doll{display:grid;grid-template-columns:70px 1fr 70px;gap:8px;align-items:center}
.dcol{display:flex;flex-direction:column;gap:8px}
.dmid{display:flex;flex-direction:column;align-items:center;gap:6px;justify-self:center;min-width:0}
.dmid img{width:112px;height:112px;max-width:100%;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.dmid b{font:700 12px var(--display);color:var(--amber)}
.slot{position:relative;width:70px;height:70px;padding:0;background:var(--panel);border:2px solid var(--rc,var(--line));display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dim);font:8px var(--display);border-radius:0;box-shadow:inset 0 0 12px rgba(255,255,255,.05)}
.slot img{width:40px;height:40px;image-rendering:pixelated}
.slot.empty{border-style:dashed;--rc:var(--line)}
.slot.sel{outline:2px solid var(--amber);outline-offset:1px}
.slot .cnt{position:absolute;right:3px;bottom:1px;font:700 11px var(--display);color:#fff;font-style:normal;text-shadow:0 1px 0 #000,1px 0 0 #000}
.slot:focus-visible,.chip:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid .slot{width:100%;height:auto;aspect-ratio:1/1}
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.subtabs .btn{min-height:38px;font-size:11px;padding:0 4px}
.subtabs .btn.on{border-color:var(--amber);color:var(--amber);background:#2a2335}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{background:var(--panel);color:var(--dim);border:1px solid var(--line);font:700 9px var(--display);padding:7px 8px;cursor:pointer;border-radius:0}
.chip.on{color:var(--amber);border-color:var(--amber);background:#2a2335}
.up{color:var(--moss)}.dn{color:var(--blood)}
.trio{display:flex;align-items:center;gap:4px}
.trio .slot{width:46px;height:46px}.trio .slot img{width:30px;height:30px}
.tab{position:relative}
.dot{position:absolute;top:3px;right:5px;width:9px;height:9px;background:var(--blood);border:1px solid #fff3c8}
#ovSpin{justify-content:center;z-index:25}
.rwin{position:relative;overflow:hidden;height:108px;border:2px solid var(--line);background:#0e0c14;flex:none;touch-action:manipulation;cursor:pointer}
.rstrip{display:flex;height:100%;will-change:transform}
.rc{flex:none;width:84px;height:100%;display:flex;align-items:center;justify-content:center;border-right:1px solid #2a2538;border-bottom:4px solid var(--rc)}
.rc img{width:52px;height:52px;image-rendering:pixelated}
.rc.hit{background:#2c2540;animation:rpulse .5s 2}
.rmark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--amber);z-index:2;box-shadow:0 0 10px var(--amber)}
.rres{min-height:64px;text-align:center}
.rname{font:700 17px var(--display);margin-bottom:4px;text-wrap:balance}
@keyframes rpulse{50%{background:#4a3d66}}
@media (prefers-reduced-motion:reduce){.rc.hit{animation:none}}

.grid .slot img{width:66%;height:66%}
.slot.void{border:2px solid #2a2538;background:#15121d;cursor:default;box-shadow:none}
.gem.coin{color:var(--amber)}
.gem.soulc{color:var(--violet)}
.rew{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 2px}
.rew .gem{font-size:11px}
.rew .gem img{width:14px;height:14px}
.eqrow{display:flex;gap:12px;justify-content:center}
.eqc{display:flex;flex-direction:column;align-items:center;gap:4px;font:9px var(--display);color:var(--dim);text-align:center}
.tab span{font-size:8px}

/* ===== карты перков ===== */
.perks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--fg);cursor:pointer;padding:12px 10px 12px;min-height:128px;border:2px solid var(--pc);border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.25)),#1b1826;box-shadow:0 0 16px -4px var(--pc);font:12px/1.3 var(--body)}
.pcard i{font:700 8px var(--display);color:var(--pc);letter-spacing:.12em;text-transform:uppercase;font-style:normal}
.pcard b{font:700 14px var(--display);color:var(--amber)}
.pcard span{color:var(--dim)}
.pcard:active{transform:scale(.97)}
.cnt{position:absolute;right:3px;bottom:1px;font:700 11px var(--display);color:#fff;font-style:normal;text-shadow:0 1px 0 #000,1px 0 0 #000}
/* ===== качество меню ===== */
.ov.full{background:radial-gradient(120% 70% at 50% 0%,#2b2142 0,#171322 55%,#100e17 100%)}
.mhead .gem{background:rgba(28,25,37,.9);border:1px solid var(--line);padding:5px 9px;border-radius:999px}
.mhead .gem img{width:15px;height:15px}
.btn{border-radius:5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.ov .big{border-radius:6px;background:linear-gradient(180deg,#f0bd5a,#d99a30);box-shadow:inset 0 -4px 0 rgba(120,70,10,.5),0 3px 0 #6a440c;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.ov .big:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(120,70,10,.5),0 1px 0 #6a440c}
.card,.item{border-radius:8px;background:linear-gradient(180deg,#242032,#1b1826)}
.card.sel{background:linear-gradient(180deg,#3a2f44,#2a2335);box-shadow:0 0 0 1px var(--amber),0 0 18px rgba(226,169,75,.25)}
.slot{border-radius:6px}
#tabbar{gap:5px}
.tab{justify-content:center;border-radius:8px;background:linear-gradient(180deg,#221e2e,#191622)}
.tab.on{background:linear-gradient(180deg,#3a2f44,#2a2335);box-shadow:0 0 14px rgba(226,169,75,.22)}
.home{display:flex;flex-direction:column;gap:12px;position:relative}
.logo{font:700 34px/1 var(--display);color:var(--amber);text-shadow:0 3px 0 #5a3a0c,0 0 24px rgba(226,169,75,.45);letter-spacing:.02em;text-align:center;margin-top:6px}
.logo small{display:block;font:700 11px var(--display);color:var(--dim);letter-spacing:.3em;margin-top:8px;text-shadow:none}
.showcase{position:relative;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#241f33,#171420);padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden}
.showcase .glow{position:absolute;left:50%;top:48px;width:220px;height:220px;margin:-110px 0 0 -110px;background:radial-gradient(circle,rgba(226,169,75,.28),transparent 65%);pointer-events:none}
.himg{position:relative;width:132px;height:132px;image-rendering:pixelated;filter:drop-shadow(0 6px 0 rgba(0,0,0,.5));animation:hfloat 2.4s ease-in-out infinite}
@keyframes hfloat{50%{transform:translateY(-6px)}}
.hname{font:700 18px var(--display);color:var(--fg)}
.hskill{font-size:11px;color:var(--dim);text-align:center;max-width:34ch;min-height:2.7em}
.hstats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hstats span{background:#100e17;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font:700 10px var(--display);color:var(--amber)}
.home .big{min-height:58px;font-size:17px;letter-spacing:.06em;flex:1 1 100%}
.embers i{position:absolute;bottom:-10px;width:4px;height:4px;background:#e2a94b;border-radius:50%;opacity:0;animation:ember 5s linear infinite;pointer-events:none}
@keyframes ember{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-300px) translateX(20px);opacity:0}}
@media (prefers-reduced-motion:reduce){.himg,.embers i,#bDown.on{animation:none}}
.zrow{display:flex;align-items:center;gap:8px}
.zrow .btn{width:42px;min-height:36px;padding:0}

/* ===== экран на всю область: поле под интерфейсом ===== */
body{padding:0}
#app{max-width:none;position:relative;gap:0}
#stage{position:absolute;inset:0;border:0;flex:none}
#hud{position:absolute;z-index:4;top:max(6px,env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));width:min(46vw,330px);background:rgba(19,17,26,.7);padding:4px 6px;gap:3px 6px}
#statline{font-size:9px}
#zoomb{top:calc(max(6px,env(safe-area-inset-top,0px)) + 62px);left:max(8px,env(safe-area-inset-left,0px));flex-direction:row}
#mini{right:max(8px,env(safe-area-inset-right,0px));top:max(8px,env(safe-area-inset-top,0px))}
#log{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:6px;width:min(40vw,360px);height:50px;background:rgba(19,17,26,.5);border:0;pointer-events:none;font-size:11px;padding:2px 6px}
#controls{position:absolute;inset:0;z-index:4;display:block;padding:0;pointer-events:none}
#controls>*{pointer-events:auto}
#joy{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));width:150px;height:150px;opacity:.92}
#knob{width:62px;height:62px;margin:-31px 0 0 -31px}
#dpad{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px)}
#acts{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));width:236px;height:190px;display:block;max-width:none;flex:none}
#acts .btn{position:absolute;border-radius:50%;min-height:0;padding:0;opacity:.94;font-size:11px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.5)}
#bAtk{right:0;bottom:0;width:98px;height:98px;font-size:15px!important}
#bSkill{right:110px;bottom:6px;width:76px;height:76px}
#bPot{right:8px;bottom:110px;width:66px;height:66px}
#bDash{right:190px;bottom:8px;width:50px;height:50px;font-size:10px;background:#1f3a5a;border-color:#6fb4ff;color:#dff0ff}
#bDash:active{background:#2f5a8a}
#bInv{right:88px;bottom:98px;width:56px;height:56px;font-size:10px}
#bDown{right:152px;bottom:94px;width:56px;height:56px;font-size:10px}

@media (orientation:portrait){
#hud{left:8px;right:8px;width:auto}
#zoomb{top:84px;left:8px;flex-direction:column}
#mini{top:84px;right:8px}
#log{left:8px;right:8px;transform:none;width:auto;bottom:170px;height:48px}
#joy{width:134px;height:134px;left:12px;bottom:14px}
#knob{width:56px;height:56px;margin:-28px 0 0 -28px}
#dpad{left:12px;bottom:14px}
#acts{transform:scale(.86);transform-origin:right bottom;right:10px;bottom:10px}
}
@media (orientation:landscape){
  .ov.full{max-width:none}
  #ovMenu{display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:6px 14px;padding-bottom:12px}
  #ovMenu .mhead{grid-column:2;grid-row:1}
  #ovMenu #mBody{grid-column:2;grid-row:2}
  #ovMenu #tabbar{grid-column:1;grid-row:1/3;grid-template-columns:1fr;grid-auto-rows:1fr;border-top:0;padding:0 0 0 0}
  .home{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;align-items:center}
  .home .logo,.home .sub{grid-column:1}
  .home .showcase{grid-column:2;grid-row:1/5}
  .home .big,.home .hint{grid-column:1}
}

    for(let j=Math.floor(cy-ry);j<=Math.ceil(cy+ry);j++)for(let i=Math.floor(cx-rx);i<=Math.ceil(cx+rx);i++){

function spawnMon(F,t,x,y,floor){
  const sc=1+Math.max(0,floor-(t.from||1))*.08;
  const m={...t,x,y,dm:1+Math.max(0,floor-8)*.12,hp:Math.round(t.hp*sc),max:Math.round(t.hp*sc),awake:false,skip:false,ox:0,oy:0,flash:0};

    const e=ELITE[Math.floor(Math.random()*4)];m.elite=e;m.n=e.n+' '+t.n;m.xp=Math.round(t.xp*2.6);
    if(e.k==='armor')m.hp=Math.round(m.hp*2.4);else m.hp=Math.round(m.hp*1.7);
    m.max=m.hp;if(e.k==='rage')m.dm*=1.5;if(e.k==='swift')m.sw=1.5;

function crateOk(map,x,y){
  if(map[y][x]!==FLOOR)return false;
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const r=map[y+j];if(!r||r[x+i]===undefined||r[x+i]===WALL)return false}
  return true;
}
function mkCrate(x,y,floor){
  const t=Math.random(),tier=t<.04+floor*.012?2:t<.26+floor*.02?1:0,hp=[2,3,4][tier];
  return {x,y,tier,hp,max:hp,flash:0,ox:0,oy:0};
}
function genFloor(floor){
  const map=Array.from({length:MH},()=>new Array(MW).fill(WALL));
  const rooms=[];
  for(let i=0;i<60&&rooms.length<11;i++){
    const w=rnd(4,9),h=rnd(4,8),x=rnd(1,MW-w-2),y=rnd(1,MH-h-2);
    if(rooms.some(r=>x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y))continue;
    rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});
    for(let j=y;j<y+h;j++)for(let k=x;k<x+w;k++)map[j][k]=FLOOR;
  }
  const carve=(a,b,hFirst)=>{let x=a.cx,y=a.cy;
    const hor=()=>{while(x!==b.cx){x+=Math.sign(b.cx-x);map[y][x]=FLOOR}};
    const ver=()=>{while(y!==b.cy){y+=Math.sign(b.cy-y);map[y][x]=FLOOR}};
    if(hFirst){hor();ver()}else{ver();hor()}};
  for(let i=1;i<rooms.length;i++)carve(rooms[i-1],rooms[i],Math.random()<.5);
  for(let i=0;i<2&&rooms.length>3;i++)carve(pick(rooms),pick(rooms),Math.random()<.5);
  const start=rooms[0],end=rooms[rooms.length-1];
  const F={floor,map,rooms,mons:[],items:[],crates:[],seen:Array.from({length:MH},()=>new Array(MW).fill(false)),vis:Array.from({length:MH},()=>new Array(MW).fill(false)),sx:start.cx,sy:start.cy,
    var:Array.from({length:MH},()=>Array.from({length:MW},()=>rnd(0,2)))};
  if(!isBossFloor(floor))map[end.cy][end.cx]=STAIRS;
  const free=r=>{for(let t=0;t<40;t++){const x=rnd(r.x,r.x+r.w-1),y=rnd(r.y,r.y+r.h-1);
    if(map[y][x]===FLOOR&&!F.mons.some(m=>m.x===x&&m.y===y)&&!F.items.some(i=>i.x===x&&i.y===y)&&!F.crates.some(c=>c.x===x&&c.y===y)&&!(x===F.sx&&y===F.sy))return[x,y]}return null};
  const pool=MON.filter(m=>floor>=m.from&&floor<=m.to);
  for(let i=1;i<rooms.length;i++){
    const r=rooms[i],n=rnd(1,2)+(floor>4?1:0);
    for(let k=0;k<n;k++){const p=free(r);if(p)spawnMon(F,pick(pool),p[0],p[1],floor)}
    if(Math.random()<.75){const p=free(r);if(p)F.items.push(Object.assign(newItem(floor),{x:p[0],y:p[1]}))}
    if(Math.random()<.65){const p=free(r);if(p)F.items.push({type:'gold',n:'Золото',amt:rnd(4,9)+floor*4,spr:'coin',x:p[0],y:p[1]})}

function los(F,x0,y0,x1,y1){
  let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx-dy,x=x0,y=y0;

    const e2=2*e;if(e2>-dy){e-=dy;x+=sx}if(e2<dx){e+=dx;y+=sy}
  }

}
function computeFov(){

    if(x<0||y<0||x>=MW||y>=MH)continue;

    if(los(F,p.x,p.y,x,y)){F.vis[y][x]=true;F.seen[y][x]=true}
  }
}

}

/* ===== Реальное время: движение, бой, монстры ===== */
const IN={joy:{x:0,y:0},pad:{x:0,y:0},keys:new Set(),atk:false};
const KEYS={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
const PR=.3,MR=.28;
const cc=()=>CLASSES[G.p.cls];
function ensureEnt(e){if(e.px===undefined){e.px=e.x+.5;e.py=e.y+.5}}
const adiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
function blockedAt(px,py,r){
  const F=G.F,x0=Math.floor(px-r),x1=Math.floor(px+r),y0=Math.floor(py-r),y1=Math.floor(py+r);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const solid=x<0||y<0||x>=MW||y>=MH||F.map[y][x]===WALL||(F.crates.length&&crateAt(x,y));
    if(!solid)continue;
    const cx=Math.max(x,Math.min(px,x+1)),cy=Math.max(y,Math.min(py,y+1));
    if((px-cx)*(px-cx)+(py-cy)*(py-cy)<r*r)return true;
  }
  return false;
}
function moveEnt(e,dx,dy,r){
  if(dx&&!blockedAt(e.px+dx,e.py,r))e.px+=dx;
  if(dy&&!blockedAt(e.px,e.py+dy,r))e.py+=dy;
  e.x=Math.floor(e.px);e.y=Math.floor(e.py);
}
function clearLine(ax,ay,bx,by){
  const d=Math.hypot(bx-ax,by-ay),n=Math.max(1,Math.ceil(d/.25));
  for(let i=1;i<n;i++){const t=i/n,x=Math.floor(ax+(bx-ax)*t),y=Math.floor(ay+(by-ay)*t);
    if(x<0||y<0||x>=MW||y>=MH||G.F.map[y][x]===WALL)return false}
  return true;
}
function distMap(){
  const F=G.F,p=G.p,D=Array.from({length:MH},()=>new Array(MW).fill(99));
  const q=[[p.x,p.y]];D[p.y][p.x]=0;
  for(let i=0;i<q.length;i++){
    const [x,y]=q[i];if(D[y][x]>=24)continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const a=x+dx,b=y+dy;
      if(a<0||b<0||a>=MW||b>=MH||F.map[b][a]===WALL||D[b][a]!==99||crateAt(a,b))continue;
      D[b][a]=D[y][x]+1;q.push([a,b]);
    }
  }
  return D;
}
function inputVec(){
  let x=IN.joy.x+IN.pad.x,y=IN.joy.y+IN.pad.y;
  for(const k of IN.keys){const d=KEYS[k];if(d){x+=d[0];y+=d[1]}}
  const m=Math.hypot(x,y);if(m<.15)return [0,0,0];
  return [x/m,y/m,Math.max(0,Math.min(1,(Math.min(m,1)-.15)/.55))];
}
function playerAttack(m){
  const p=G.p;let d=rnd(1,3)+atkTotal()+(p.haste>0?2:0);
  const crit=p.ambush>0||Math.random()<p.crit;
  if(p.ambush>0)p.ambush--;
  if(crit){d=Math.round(d*(p.cm||2));addLog('Критический удар! '+m.n+' −'+d+'.','gold');G.shake=Math.max(G.shake,4)}
  dealDamage(m,d,crit?'#ffd25a':'#fff');
}
function targetsFor(c,p,anyDir){
  const out=[],F=G.F;
  const test=(e,kind)=>{
    const pxc=e.px??e.x+.5,pyc=e.py??e.y+.5;
    const ddx=pxc-p.px,ddy=pyc-p.py,dist=Math.hypot(ddx,ddy);
    if(dist>c.range+(p.rangeB||0)+(e.boss?.3:0))return;
    if(!anyDir&&dist>.7&&Math.abs(adiff(Math.atan2(ddy,ddx),p.face))>(c.arc+(p.arcB||0))*Math.PI/360)return;
    if(!clearLine(p.px,p.py,pxc,pyc))return;
    if(c.ranged&&!F.vis[e.y][e.x])return;
    out.push({e,kind,dist,ang:Math.atan2(ddy,ddx)});
  };
  F.mons.forEach(m=>{ensureEnt(m);test(m,'m')});
  if(!c.ranged||true)F.crates.forEach(cr=>{if(Math.hypot(cr.x+.5-p.px,cr.y+.5-p.py)<=Math.min(c.range,1.8))test(cr,'c')});
  return out.sort((a,b)=>a.dist-b.dist);
}
function swing(c,t){
  const p=G.p,aspd=c.aspd*(p.aspdM||1)*(p.haste>0?.55:1);p.acd=aspd;
  const ox=Math.cos(p.face),oy=Math.sin(p.face);
  if(c.ranged){
    const h=t.find(q=>q.kind==='m')||t[0];
    G.bolts.push({x1:p.px,y1:p.py,x2:h.e.px??h.e.x+.5,y2:h.e.py??h.e.y+.5,life:7,col:p.cls==='mage'?'#c06aff':'#f2ecd8'});
    p.face=h.ang;
    if(h.kind==='m')playerAttack(h.e);else hitCrate(h.e,1);
  }else{
    G.slash.push({x:p.px,y:p.py,a:p.face,r:c.range+(p.rangeB||0),arc:(c.arc+(p.arcB||0))*Math.PI/180,life:9,col:p.haste>0?'#ff7a5e':'#ffffff'});
    p.ox=ox*.18;p.oy=oy*.18;
    for(const q of t){
      if(q.kind==='m'){
        playerAttack(q.e);
        if(!q.e.boss&&q.e.hp>0)moveEnt(q.e,Math.cos(q.ang)*.3,Math.sin(q.ang)*.3,MR);
      }else hitCrate(q.e,1);
    }
  }
}
function tick(dt){
  const F=G.F,p=G.p,c=cc();ensureEnt(p);
  G.time+=dt;
  const tn=Math.floor(G.time/.6);if(tn!==G.turn){G.turn=tn;checkAch()}
  p.cd=Math.max(0,p.cd-dt);if(p.dashCd>0)p.dashCd-=dt;if(p.iFr>0)p.iFr-=dt;if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0}if(p.spdT>0)p.spdT-=dt;if(p.defT>0)p.defT-=dt;if(p.haste>0)p.haste-=dt;p.acd-=dt;
  // движение с плавным разгоном
  const [ix,iy,f]=inputVec(),ox=p.x,oy=p.y;
  p.vx=p.vx||0;p.vy=p.vy||0;
  const cs=c.spd*(p.spdM||1)*(p.spdT>0?1.4:1),tvx=f>0?ix*f*cs:0,tvy=f>0?iy*f*cs:0,k=1-Math.exp(-dt*(f>0?20:26));
  p.vx+=(tvx-p.vx)*k;p.vy+=(tvy-p.vy)*k;
  const sp=Math.hypot(p.vx,p.vy);
  if(p.dashT>0){
    p.dashT-=dt;const x0=p.px,y0=p.py;moveEnt(p,p.dvx*dt,p.dvy*dt,PR);
    p.walk+=Math.hypot(p.px-x0,p.py-y0)*.6;p.moving=true;p.vx=p.dvx*.35;p.vy=p.dvy*.35;
    if(typeof burst==='function'&&!REDUCE){G.parts=G.parts||[];G.parts.push({x:p.px,y:p.py,vx:0,vy:0,life:12,col:'#bfe8ff'},{x:p.px+(Math.random()-.5)*.3,y:p.py+(Math.random()-.5)*.3,vx:0,vy:-.3,life:9,col:'#7fb8ff'})}
  }else if(sp>.05){
    const x0=p.px,y0=p.py;moveEnt(p,p.vx*dt,p.vy*dt,PR);
    p.walk+=Math.hypot(p.px-x0,p.py-y0);p.moving=sp>.4;
    if(f>0){p.face=Math.atan2(iy,ix);if(Math.abs(ix)>.2)p.flip=ix<0}
  }else{p.moving=false;p.vx=p.vy=0}
  if(p.x!==ox||p.y!==oy){
    computeFov();G.dT=0;
    if(F.map[p.y][p.x]===TRAP){const d=rnd(3,6)+F.floor;F.map[p.y][p.x]=TRAPUSED;META.stats.traps++;addLog('Ловушка! −'+d+' HP.','bad');hurtPlayer(d,'ловушка');if(G.over)return}
  }
  for(const s of F.shrines||[]){if(!s.used&&Math.hypot(s.x+.5-p.px,s.y+.5-p.py)<.85)useShrine(s)}
  // предметы
  for(const it of F.items.slice()){
    if(it.cool>0){it.cool-=dt;continue}
    if(Math.hypot(it.x+.5-p.px,it.y+.5-p.py)<.7)pickUp(it);
  }
  // атака: по кнопке (можно удерживать) или автоматически, если включено
  if(p.acd<=0&&(IN.atk||(META.set&&META.set.auto))){
    let t=targetsFor(c,p,false);
    if(!t.length&&(!p.moving||IN.atk)){
      const any=targetsFor(c,p,true);
      if(any.length){p.face=any[0].ang;if(Math.abs(Math.cos(p.face))>.2)p.flip=Math.cos(p.face)<0;t=targetsFor(c,p,false)}
    }
    if(t.length)swing(c,t);
    else if(IN.atk&&!c.ranged){p.acd=c.aspd*.8;G.slash.push({x:p.px,y:p.py,a:p.face,r:c.range,arc:c.arc*Math.PI/180,life:7,col:'#8d869c'})}
  }
  // волны врагов
  G.dT-=dt;if(G.dT<=0){G.D=distMap();G.dT=.35}
  for(const m of F.mons.slice()){if(G.over)return;monUpdate(m,dt)}
  if(G.over)return;
  p.rt+=dt;if(p.rt>=p.regen*.9){p.rt=0;if(p.hp<p.max)p.hp++}
  G.sv-=dt;if(G.sv<=0){G.sv=2;saveRun()}
  G.hu=(G.hu||0)-dt;if(G.hu<=0){G.hu=.12;updateHud()}
  if(G.pend>0&&!anyOverlay())showPerks();
}
function monUpdate(m,dt){
  const F=G.F,p=G.p;ensureEnt(m);
  if(!m.init){m.init=1;m.spd=m.spd||(m.boss?1.8:m.slow?1.15:m.fast?3.3:m.erratic?3.3:2.2);m.cdA=m.slow?1.5:m.erratic?.9:1.1;m.acd=.7;m.sum=6;m.wa=0;m.wt=0}
  const dx=p.px-m.px,dy=p.py-m.py,dist=Math.hypot(dx,dy);
  if(!m.awake){if(dist<8&&F.vis[m.y][m.x]&&Math.random()<dt*2.5)m.awake=true;return}
  m.acd-=dt;m.mv=false;
  if(Math.abs(dx)>.15)m.flip=dx<0;
  if(m.boss){
    m.sum-=dt;
    if(m.sum<=0&&F.mons.length<6){
      m.sum=7;
      const tpl=m.sumCh===undefined?MON[3]:m.sumCh?MON.find(x=>x.ch===m.sumCh):null;
      const sp=tpl?[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>passable(m.x+a,m.y+b)&&!crateAt(m.x+a,m.y+b)&&!monAt(m.x+a,m.y+b)&&!(p.x===m.x+a&&p.y===m.y+b)):[];
      if(sp.length){const [a,b]=pick(sp);spawnMon(F,tpl,m.x+a,m.y+b,F.floor);const n=F.mons[F.mons.length-1];n.awake=true;addLog(m.n+' призывает: '+tpl.n+'!','mag')}
    }
  }
  if(m.rng&&dist<=5.5&&dist>1.3&&clearLine(m.px,m.py,p.px,p.py)){
    if(m.acd<=0){
      m.acd=m.cdA*1.8;
      const dmg=Math.max(1,Math.round(rnd(m.atk[0],m.atk[1])*(m.dm||1))-rnd(0,defTotal()));
      G.bolts.push({x1:m.px,y1:m.py,x2:p.px,y2:p.py,life:9,col:m.boss?'#ff6a3a':'#ff9a3d',big:m.boss?1:0});
      addLog(m.n+' бросает огонь −'+dmg+'.','bad');hurtPlayer(dmg,m.n);
    }
    return;
  }
  const reach=m.boss?1.15:.95;
  if(dist<=reach&&clearLine(m.px,m.py,p.px,p.py)){
    if(m.acd<=0){
      m.acd=m.cdA;m.ox=dx/dist*.3;m.oy=dy/dist*.3;
      if(Math.random()<Math.min(.2,.05+(p.dodge||0))){addLog(m.n+' не попал.','');fxText(p.px-.5,p.py-.5,'мимо','#b9b2c4');return}
      const dmg=Math.max(1,Math.round(rnd(m.atk[0],m.atk[1])*(m.dm||1))-rnd(0,defTotal()));
      addLog(m.n+' бьёт вас −'+dmg+'.','bad');
      if(m.drain||(m.elite&&m.elite.k==='vamp'))m.hp=Math.min(m.max,m.hp+Math.ceil(dmg/2));
      hurtPlayer(dmg,m.n);
    }
    return;
  }
  // куда идти
  let tx=p.px,ty=p.py;
  const D=G.D;
  if(!(dist<4&&clearLine(m.px,m.py,p.px,p.py))&&D&&D[m.y][m.x]!==99){
    let best=null,bd=D[m.y][m.x];
    for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const x=m.x+a,y=m.y+b;if(x<0||y<0||x>=MW||y>=MH)continue;
      if(D[y][x]<bd){bd=D[y][x];best=[x,y]}
    }
    if(best){tx=best[0]+.5;ty=best[1]+.5}
  }
  let ang=Math.atan2(ty-m.py,tx-m.px);
  if(m.erratic){m.wt-=dt;if(m.wt<=0){m.wt=.3+Math.random()*.3;m.wa=(Math.random()-.5)*2.6}ang+=m.wa}
  const sp=m.spd*(m.sw||1)*dt;
  moveEnt(m,Math.cos(ang)*sp,Math.sin(ang)*sp,MR);m.mv=true;m.walk=(m.walk||0)+sp;
  for(const o of F.mons){
    if(o===m||o.px===undefined)continue;
    const ex=m.px-o.px,ey=m.py-o.py,d=Math.hypot(ex,ey);
    if(d<.6&&d>.001)moveEnt(m,ex/d*(.6-d)*.4,ey/d*(.6-d)*.4,MR);
  }
}

/* ----- навыки ----- */
function doDash(){
  const p=G.p;if(!G||G.over||p.dashCd>0||p.dashT>0)return;

  for(const m of F.mons){if(F.vis[m.y][m.x]){mctx.fillStyle=m.boss?'#ffd25a':'#ff5a4f';mctx.fillRect(m.x*u-u*.5,m.y*u-u*.5,u*2,u*2)}}
  const blink=REDUCE||Math.floor(TM/400)%2===0;

let lastTs=0;
let _fc=0,_ft=0;
function frame(ts){
  TM=ts||0;const dt=Math.min(.05,Math.max(0,(TM-lastTs)/1000));lastTs=TM;
  if(G&&G.F){
    if(!G.over&&!anyOverlay())tick(G.slowT>0?dt*.3:dt);
    camStep(dt);
    for(const e of [G.p,...G.F.mons,...(G.F.crates||[])]){
      e.ox*=.78;e.oy*=.78;if(Math.abs(e.ox)<.01)e.ox=0;if(Math.abs(e.oy)<.01)e.oy=0;if(e.flash>0)e.flash--;
    }
    if(G.shake>0)G.shake--;if(G.flash>0)G.flash--;
    G.fx=G.fx.filter(f=>--f.life>0);
    G.slash=(G.slash||[]).filter(s=>--s.life>0);
    for(const q of G.parts||[]){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;q.life--}
    G.parts=(G.parts||[]).filter(q=>q.life>0);G.bolts=(G.bolts||[]).filter(s=>--s.life>0);
  }
  if(G&&G.slowT>0)G.slowT-=dt;
  if(META.set.fps){_fc++;if(TM-_ft>=500){const el=$('fps');el.textContent=Math.round(_fc*1000/(TM-_ft))+' FPS';_fc=0;_ft=TM}}
  draw();drawMini();
  requestAnimationFrame(frame);
}

  if(a==='no'){RST.kind=null;return true}
  if(a==='yes'){
    if(RST.kind==='all'){try{localStorage.removeItem('morok-meta2');localStorage.removeItem(RUNKEY)}catch(e){}location.reload();return false}
    clearRun();G=null;RST.kind=null;MTAB=null;toast('Текущий забег удалён');return true;
  }
  return true;
}

/* ----- крутилка ----- */
function roulette(title,cells,win,reveal,done){
  const o=$('ovSpin'),CW=84;
  o.innerHTML='<h2>'+title+'</h2><div class="rwin" id="rwin"><div class="rmark"></div><div class="rstrip" id="rstrip">'+
    cells.map((c,i)=>'<div class="rc" style="--rc:'+c.col+'"><img src="'+spriteURL(c.spr)+'" alt=""></div>').join('')+'</div></div>'+
    '<div class="rres" id="rres"></div><div class="row"><button class="btn big" id="rOk" hidden>Забрать</button></div><div class="hint">Тап по ленте пропускает анимацию.</div>';
  o.hidden=false;
  const strip=$('rstrip'),box=$('rwin'),W=box.clientWidth;
  const centre=win*CW+CW/2-W/2,off=centre+(Math.random()-.5)*CW*.6;
  let finished=false;
  const fin=()=>{
    if(finished)return;finished=true;
    strip.style.transition='none';strip.style.transform='translateX('+(-centre)+'px)';
    strip.children[win].classList.add('hit');$('rres').innerHTML=reveal;$('rOk').hidden=false;
  };
  const dur=REDUCE?.5:4.6;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{strip.style.transition='transform '+dur+'s cubic-bezier(.08,.55,.12,1)';strip.style.transform='translateX('+(-off)+'px)'}));
  strip.addEventListener('transitionend',fin,{once:true});
  setTimeout(fin,dur*1000+500);
  box.onclick=fin;
  $('rOk').onclick=()=>{o.hidden=true;if(done)done()};
}
function itemSpin(it,ci,done){
  const cells=[];for(let i=0;i<38;i++){const x=i===31?it:rollItem(ci);cells.push({spr:itemSpr(x),col:RARC[x.r]})}
  roulette(CHESTS[ci].n,cells,31,'<div class="rname" style="color:'+RARC[it.r]+'">'+RARN[it.r]+' · '+itemName(it)+'</div><div class="hint">'+ETNAME[it.t]+' · '+statsText(itemStats(it))+'</div>',done);
}
function chestSpin(t,done){
  const cells=[];for(let i=0;i<38;i++){const x=i===31?t:rollIdx(BOSSW);cells.push({spr:'chest_'+x,col:RARC[x]})}
  roulette('Награда за победу над Личом',cells,31,'<div class="rname" style="color:'+RARC[t]+'">'+CHESTS[t].n+'</div><div class="hint">Сундук добавлен во вкладку «Кейсы».</div>',done);
}
function openChest(i){
  if(META.chests[i]<1)return;
  META.chests[i]--;const it=rollItem(i);META.inv.push(it);META.stats.opened++;noteItem(it);saveMeta();checkAch();
  itemSpin(it,i,()=>showMenu());
}

/* ----- действия в меню ----- */
function equipSel(){
  const i=META.inv.findIndex(x=>itemKey(x)===INV.sel);if(i<0)return;
  const it=META.inv.splice(i,1)[0],old=META.eq[it.t];
  META.eq[it.t]=it;if(old)META.inv.push(old);
  INV.sel='eq:'+it.t;saveMeta();
}
function unequipSel(){
  const t=INV.sel.slice(3),it=META.eq[t];
  if(it){META.inv.push(it);META.eq[t]=null}
  INV.sel=null;saveMeta();
}
$('ovMenu').addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-sub],[data-f],[data-it],[data-slot],[data-act],[data-open],[data-craft],[data-craftall],[data-buy],[data-claim],[data-claimall],[data-up],[data-cls],[data-set],[data-rst],#mReset,#mSet,#mPlay,#mCont,#mChange,#mCtl,#mClose');
  if(!t)return;
  const d=t.dataset;
  if(d.tab!==undefined){MTAB=MTAB===d.tab?null:d.tab;INV.sel=null}
  else if(t.id==='mClose'){MTAB=null;RST.kind=null}
  else if(t.id==='mSet'){MTAB=MTAB==='set'?null:'set'}
  else if(t.id==='mReset'){RST.kind=null;MTAB=MTAB==='reset'?null:'reset'}
  else if(d.set!==undefined){setOpt(d.set)}
  else if(d.rst!==undefined){if(!rstAct(d.rst))return}
  else if(d.sub!==undefined){INV.sub=d.sub;INV.sel=null}
  else if(d.f!==undefined){INV.filter=d.f||null;INV.sel=null}
  else if(d.it!==undefined){INV.sel=INV.sel===d.it?null:d.it}
  else if(d.slot!==undefined){INV.sub='items';if(META.eq[d.slot])INV.sel='eq:'+d.slot;else{INV.filter=d.slot;INV.sel=null}}
  else if(d.act!==undefined){if(d.act==='equip')equipSel();else unequipSel()}
  else if(d.open!==undefined){openChest(+d.open);return}
  else if(d.craft!==undefined){const m=craft(d.craft,1);if(m.length)toast('Создан: '+RARN[m[0].r]+' '+itemName(m[0]));saveMeta()}
  else if(d.craftall!==undefined){let n=0;for(const s of stacks()){if(s.n>=3&&s.it.r<3)n+=craft(itemKey(s.it),Math.floor(s.n/3)).length}if(n)toast('Создано предметов: '+n);saveMeta()}
  else if(d.buy!==undefined){const i=+d.buy,c=CHESTS[i];if(META.crystals>=c.price){META.crystals-=c.price;META.chests[i]++;META.stats.bought++;saveMeta();toast('Куплено: '+c.n)}}
  else if(d.claim!==undefined){const a=ACH.find(x=>x.id===d.claim);if(a&&META.ach[a.id]&&!META.claim[a.id]){const x=claimAch(a);saveMeta();toast('Награда: '+rewText(x))}}
  else if(d.claimall!==undefined){const t={s:0,g:0,c:0};ACH.forEach(a=>{if(META.ach[a.id]&&!META.claim[a.id]){const x=claimAch(a);t.s+=x.s;t.g+=x.g;t.c+=x.c}});saveMeta();if(t.g||t.c||t.s)toast('Награда: '+rewText(t))}
  else if(d.up!==undefined){const s=SHOP.find(x=>x.k===d.up),c=upCost(s);if(META.up[s.k]<s.max&&META.gold>=c){META.gold-=c;META.up[s.k]++;saveMeta()}}
  else if(d.cls!==undefined){const k=d.cls,c=CLASSES[k];if(META.owned[k])META.cls=k;else if(META.souls>=c.cost){META.souls-=c.cost;META.owned[k]=true;META.cls=k}else{toast('Не хватает душ');return}saveMeta()}
  else if(t.id==='mPlay'){startRun();return}
  else if(t.id==='mCont'){doContinue();return}
  else if(t.id==='mChange'){MTAB='heroes'}
  else if(t.id==='mCtl'){toggleCtl();t.textContent=ctlLabel();return}
  showMenu();
});

function startRun(){hideAll();newGame();saveRun()}
function doContinue(){hideAll();if(!continueRun())showMenu(null)}

function showPause(){
  if(!G||G.over||anyOverlay())return;
  const o=$('ovPause');
  o.innerHTML='<h2>Пауза</h2><p>Этаж '+G.F.floor+' · время '+Math.floor(G.time/60)+':'+String(Math.floor(G.time%60)).padStart(2,'0')+' · убито '+G.kills+'</p>'+

let perkReroll=true;
function rollPerks(n){
  const out=[],pool=PERKS.slice();
  while(out.length<n&&pool.length){
    const tot=pool.reduce((t,p)=>t+PERKR[p.r].w,0);let r=Math.random()*tot,i=0;
    for(;i<pool.length;i++){if((r-=PERKR[pool[i].r].w)<0)break}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return out;
}
function showPerks(opts){
  if(anyOverlay()&&!opts)return;
  const o=$('ovPerk');
  if(!opts){opts=rollPerks(4);perkReroll=true}
  let h='<h2>Уровень '+G.p.lvl+'</h2><p>Выберите одну из карт.</p><div class="perks">';
  opts.forEach((pk,i)=>{const R=PERKR[pk.r];
    h+='<button class="pcard" data-pk="'+i+'" style="--pc:'+R.c+'"><i>'+R.n+'</i><b>'+pk.n+'</b><span>'+pk.d+'</span></button>'});
  h+='</div>'+(perkReroll?'<div class="row"><button class="btn big" id="pkRe" style="background:var(--panel2);color:var(--fg);border-color:var(--line)">Обновить карты (1 раз)</button></div>':'');
  o.innerHTML=h;o.hidden=false;
  const re=$('pkRe');if(re)re.onclick=()=>{perkReroll=false;showPerks(rollPerks(4))};
  o.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{
    const pk=opts[+b.dataset.pk];pk.f(G.p);G.pend--;addLog('Перк: '+pk.n+'.','gold');
    o.hidden=true;computeFov();updateHud();
    if(G.pend>0)showPerks();
  });
}
const RI={sel:null};
const IT_COL={pot:'#d0483f',scr:'#cfc7ae',wpn:'#c9d2e0',arm:'#9fb4c8'};
const IT_DESC={heal:'Лечит 45% здоровья.',str:'Атака +1 навсегда.',vig:'Максимум HP +8.',tele:'Телепорт в случайное место этажа.',map:'Открывает карту этажа.',fire:'Огонь по всем видимым врагам.',spd:'Скорость бега +40% на 20 секунд.',foc:'Мгновенно восстанавливает навык.',arm:'Защита +3 на 30 секунд.'};
function renderInv(){
  const o=$('ovInv'),p=G.p;
  const eqc=(it,lab,sp)=>'<div class="eqc"><span class="slot'+(it?'':' empty')+'" style="--rc:'+(it?IT_COL[it.type]:'var(--line)')+'">'+(it?'<img src="'+spriteURL(it.spr)+'" alt="">':'<span>'+lab+'</span>')+'</span><span>'+(it?it.n:'нет')+'</span></div>';
  let h='<h2>Рюкзак ('+p.inv.length+'/'+maxInv()+')</h2><div class="eqrow">'+eqc(p.wpn,'Оружие','wpn')+eqc(p.arm,'Броня','arm')+'</div>';
  const it=RI.sel!=null?p.inv[RI.sel]:null;
  if(RI.sel!=null&&!it)RI.sel=null;
  if(it){
    const lab=it.type==='pot'?'Выпить':it.type==='scr'?'Прочесть':'Надеть';
    const ds=it.type==='wpn'?'Атака +'+it.bonus+'.':it.type==='arm'?'Защита +'+it.bonus+'.':(IT_DESC[it.k]||'');
    h+='<div class="item" style="border-color:'+IT_COL[it.type]+';grid-template-columns:36px 1fr"><img src="'+spriteURL(it.spr)+'" alt=""><div>'+it.n+(it.cnt>1?' ×'+it.cnt:'')+'<small>'+ds+'</small></div></div>'+
      '<div class="row"><button class="btn big" data-use="'+RI.sel+'">'+lab+'</button><button class="btn" data-drop="'+RI.sel+'" style="flex:none">Выбросить</button></div>';
  }
  let g='';
  for(let i=0;i<maxInv();i++){
    const x=p.inv[i];
    g+=x?'<button class="slot'+(RI.sel===i?' sel':'')+'" style="--rc:'+IT_COL[x.type]+'" data-ri="'+i+'"><img src="'+spriteURL(x.spr)+'" alt="">'+(x.cnt>1?'<i class="cnt">'+x.cnt+'</i>':'')+'</button>':'<span class="slot void"></span>';
  }
  h+='<div class="grid">'+g+'</div><div class="row"><button class="btn big" id="iClose">Закрыть</button></div>';
  o.innerHTML=h;
  o.querySelectorAll('[data-ri]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ri;RI.sel=RI.sel===i?null:i;renderInv()});
  o.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{
    if(useItem(+b.dataset.use)){RI.sel=null;updateHud();if(!G.over&&G.pend===0){renderInv();o.hidden=false}}
  });
  o.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.drop,x=p.inv[i];p.inv.splice(i,1);RI.sel=null;
    if(!itemAt(p.x,p.y))G.F.items.push(Object.assign({},x,{x:p.x,y:p.y,cool:4}));
    addLog('Вы выбросили: '+x.n+'.','');updateHud();renderInv();
  });
  $('iClose').onclick=()=>{o.hidden=true};
}
function toggleInv(){
  if(!G||G.over)return;
  const o=$('ovInv');
  if(!o.hidden){o.hidden=true;return}
  if(anyOverlay())return;
  renderInv();o.hidden=false;
}

/* ===== Джойстик ===== */
const joy=$('joy'),knob=$('knob');
let jid=null;
function joyUpdate(e){
  const r=joy.getBoundingClientRect(),R=r.width/2;
  let dx=e.clientX-(r.left+R),dy=e.clientY-(r.top+R);
  const m=Math.hypot(dx,dy),lim=R*.62;
  if(m>lim){dx=dx/m*lim;dy=dy/m*lim}
  IN.joy={x:dx/lim,y:dy/lim};
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
}
function joyEnd(){
  jid=null;IN.joy={x:0,y:0};
  knob.style.transform='translate(0,0)';
}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(jid);joyUpdate(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid){e.preventDefault();joyUpdate(e)}});
joy.addEventListener('pointerup',e=>{if(e.pointerId===jid)joyEnd()});
joy.addEventListener('pointercancel',joyEnd);
joy.addEventListener('lostpointercapture',joyEnd);

mini.addEventListener('click',()=>mini.classList.toggle('big'));

/* ===== Крестовина ===== */
const padHeld=new Map();
const padSum=()=>{let x=0,y=0;padHeld.forEach(d=>{x+=d[0];y+=d[1]});IN.pad={x,y}};
document.querySelectorAll('#dpad [data-d]').forEach(b=>{
  const d=b.dataset.d.split(',').map(Number);
  b.addEventListener('pointerdown',e=>{e.preventDefault();padHeld.set(e.pointerId,d);padSum()});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{padHeld.delete(e.pointerId);padSum()}));
});
$('bWait').addEventListener('pointerdown',e=>{e.preventDefault();if(!blocked())useSkill()});

/* ===== Кнопки и клавиатура ===== */
const bAtk=$('bAtk');
bAtk.addEventListener('pointerdown',e=>{e.preventDefault();bAtk.setPointerCapture(e.pointerId);IN.atk=true;bAtk.classList.add('hold')});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>bAtk.addEventListener(ev,()=>{IN.atk=false;bAtk.classList.remove('hold')}));
$('zIn').onclick=()=>setZoom(ZOOM-1);$('zOut').onclick=()=>setZoom(ZOOM+1);
const ptrs=new Map();let pz=null;
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===2){const [a,b]=[...ptrs.values()];pz={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:ZOOM}}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2&&pz){const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d>10)setZoom(pz.z*pz.d/d)}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pz=null}));
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(ZOOM+(e.deltaY>0?.7:-.7))},{passive:false});
function tapBtn(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn()});b.addEventListener('click',e=>e.preventDefault())}
tapBtn('bSkill',()=>{if(!blocked())useSkill()});
tapBtn('bPot',()=>{if(!blocked())quickPotion()});
tapBtn('bInv',toggleInv);
tapBtn('bDash',()=>{if(!blocked())doDash()});
tapBtn('bDown',()=>{if(!blocked())descend()});
$('bMenu').onclick=showPause;
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(KEYS[k]){e.preventDefault();IN.keys.add(k);return}
  if(k==='i')toggleInv();
  else if(k==='e'||k==='z'){if(!blocked())useSkill()}
  else if(k==='c'||k==='shift'){if(!blocked())doDash()}
  else if(k==='h'||k==='q'){if(!blocked())quickPotion()}
  else if(k===' '||k==='j'||k==='f'){e.preventDefault();IN.atk=true;$('bAtk').classList.add('hold')}
  else if(k==='x'||k==='>'){e.preventDefault();if(!blocked())descend()}
  else if(k==='+'||k==='='){setZoom(ZOOM-1)}
  else if(k==='-'){setZoom(ZOOM+1)}
  else if(k==='escape')showPause();
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();IN.keys.delete(k);if(k===' '||k==='j'||k==='f'){IN.atk=false;$('bAtk').classList.remove('hold')}});
window.addEventListener('blur',()=>{IN.atk=false;IN.keys.clear();joyEnd();padHeld.clear();padSum()});
new ResizeObserver(()=>fit()).observe($('stage'));
window.addEventListener('resize',fit);

/* ===== Запуск ===== */
loadMeta();SHOP.forEach(s=>{if(typeof META.up[s.k]!=='number')META.up[s.k]=0});META.set=Object.assign({vib:true,mini:true,lefty:false,auto:false,zoom:8},META.set||{});ZOOM=ZC=Math.max(5,Math.min(14,+META.set.zoom||8));applyCtl();applyLefty();applyFps();G=null;fit();showMenu();
requestAnimationFrame(frame);
</script>
